<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>[테스트 픽스처] 카페24 텍스트버튼형 옵션 모킹</title>
</head>
<body>
<!-- ============================================================
  테스트 전용 픽스처 — 몰에 업로드하지 않습니다.
  카페24 "표시방식: 텍스트버튼형" 상품 상세의 옵션 영역을 모킹합니다.

  실제 카페24 동작을 그대로 재현:
   - 옵션 버튼 클릭 → 카페24가 버튼에 selected 클래스 부여 + 내부 select 동기화
   - 필수 옵션이 모두 정해지면 #totalProducts 에 선택상품 행 추가
   - 행 추가 후 옵션 선택은 초기화 (여러 개 담기 위해)
   - 이미 담긴 옵션값을 다시 고르면 담기지 않음 (→ suffix 설계가 필요한 이유)
============================================================ -->

<div id="pickOptionRoot"></div>

<table class="xans-element- xans-product xans-product-option">
  <tbody>
    <tr class="xans-record-">
      <th scope="row">개입수</th>
      <td>
        <div class="ec-base-product-option">
          <ul class="ec-product-optionButton">
            <li><a href="#none" class="ec-option-button" rel="10개입_1">10개입_1</a></li>
            <li><a href="#none" class="ec-option-button" rel="10개입_2">10개입_2</a></li>
            <li><a href="#none" class="ec-option-button" rel="30개입_1">30개입_1</a></li>
            <li><a href="#none" class="ec-option-button" rel="30개입_2">30개입_2</a></li>
            <li><a href="#none" class="ec-option-button" rel="50개입_1">50개입_1</a></li>
            <li><a href="#none" class="ec-option-button" rel="50개입_2">50개입_2</a></li>
            <li><a href="#none" class="ec-option-button" rel="100개입_1">100개입_1</a></li>
          </ul>
        </div>
        <!-- 텍스트버튼형이어도 카페24는 내부 select 를 함께 둡니다 (숨김) -->
        <select id="product_option_id1" name="option1" option_select_element style="display:none">
          <option value="*">- [필수] 옵션을 선택해 주세요 -</option>
          <option value="10개입_1">10개입_1</option>
          <option value="10개입_2">10개입_2</option>
          <option value="30개입_1">30개입_1</option>
          <option value="30개입_2">30개입_2</option>
          <option value="50개입_1">50개입_1</option>
          <option value="50개입_2">50개입_2</option>
          <option value="100개입_1">100개입_1</option>
        </select>
      </td>
    </tr>
  </tbody>
</table>

<div id="totalProducts" class="xans-element- xans-product xans-product-total">
  <table>
    <tbody class="option_products"></tbody>
  </table>
</div>

<div class="xans-product-action">
  <button type="button" class="btn_cart">장바구니</button>
  <button type="button" class="btnBuy">바로 구매하기</button>
</div>

<script>
/* ---- 카페24 텍스트버튼형 옵션 엔진 (모킹) ---- */
window.__cafe24Mock = (function () {
  var PRICES = { '10개입': 24700, '30개입': 70500, '50개입': 111500, '100개입': 196000 };
  var buttons = document.querySelectorAll('.ec-option-button');
  var sel = document.getElementById('product_option_id1');
  var tbody = document.querySelector('#totalProducts .option_products');
  var alerts = [];

  function addRow(value) {
    var base = value.replace(/_\d+$/, '');
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="option"><strong>' + value + '</strong></td>' +
      '<td class="quantity"><input type="text" class="quantity_opt" value="1"></td>' +
      '<td class="price">' + (PRICES[base] || 0).toLocaleString() + '원</td>' +
      '<td class="delete"><a href="#none" class="btnDel">삭제</a></td>';
    tr.querySelector('.btnDel').addEventListener('click', function (e) {
      e.preventDefault();
      tr.remove();
    });
    tbody.appendChild(tr);
  }

  function alreadyPicked(value) {
    return [].some.call(tbody.querySelectorAll('tr .option strong'), function (s) {
      return s.textContent.trim() === value;
    });
  }

  function select(value) {
    /* 카페24: 버튼 선택 상태 갱신 + 내부 select 동기화 */
    [].forEach.call(buttons, function (b) {
      b.classList.toggle('selected', b.getAttribute('rel') === value);
    });
    sel.value = value;

    if (alreadyPicked(value)) {
      alerts.push('이미 선택하신 옵션입니다.');
      return;
    }
    addRow(value);
    /* 담기 완료 후 옵션 선택 초기화 (카페24 기본 동작) */
    [].forEach.call(buttons, function (b) { b.classList.remove('selected'); });
    sel.value = '*';
  }

  [].forEach.call(buttons, function (b) {
    b.addEventListener('click', function (e) {
      e.preventDefault();
      select(b.getAttribute('rel'));
    });
  });
  /* select 를 직접 바꾸는 경로도 지원 (셀렉트형 스킨과 동일) */
  sel.addEventListener('change', function () {
    if (sel.value && sel.value !== '*') select(sel.value);
  });

  return { alerts: alerts, rows: function () { return tbody.querySelectorAll('tr'); } };
})();
</script>
</body>
</html>
