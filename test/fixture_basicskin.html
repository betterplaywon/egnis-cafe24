<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><title>[테스트 픽스처] 카페24 기본 스킨 렌더링 결과 모킹</title></head>
<body>
<!-- ============================================================
  테스트 전용 픽스처 — 몰에 업로드하지 않습니다.
  카페24 "기본 스킨 detail.html" 이 실제로 렌더링된 뒤의 DOM 을 모킹합니다.
  (module="..." → xans-element- xans-product xans-product-... 클래스 부여,
   {$form.option} → 텍스트버튼 목록 + hidden select,
   {$total.total_id} → id="totalProducts")

  기본 스킨의 까다로운 지점을 그대로 재현합니다:
   - #totalProducts 안에 <tbody> 가 3개이고, 행은 "마지막" tbody 에 추가됨
   - 행 구조가 <p class="product">상품명<br><span>옵션</span></p>
   - 삭제 버튼이 <img class="option_box_del">
   - 구매(a.btnSubmit) / 장바구니(a.btnNormal.sizeL) / 관심상품(a.btnNormal.sizeL)
     이 클래스로 구분되지 않음
============================================================ -->

<div class="xans-element- xans-product xans-product-detail">
  <div id="pickOptionRoot"></div>

  <table border="1" class="xans-element- xans-product xans-product-option">
    <caption>상품 옵션</caption>
    <tbody class="xans-element- xans-product xans-product-option">
      <tr>
        <th scope="row">개입수</th>
        <td>
          <div class="ec-base-product-option">
            <ul class="ec-product-optionButton">
              <li><a href="#none" class="ec-option-button" rel="10개입_1">10개입_1</a></li>
              <li><a href="#none" class="ec-option-button" rel="10개입_2">10개입_2</a></li>
              <li><a href="#none" class="ec-option-button" rel="30개입_1">30개입_1</a></li>
              <li><a href="#none" class="ec-option-button" rel="30개입_2">30개입_2</a></li>
              <li><a href="#none" class="ec-option-button" rel="50개입_1">50개입_1</a></li>
              <li><a href="#none" class="ec-option-button" rel="50개입_2">50개입_2</a></li>
              <li><a href="#none" class="ec-option-button" rel="100개입_1">100개입_1</a></li>
            </ul>
          </div>
          <select id="product_option_id1" name="option1" option_select_element style="display:none">
            <option value="*">- [필수] 옵션을 선택해 주세요 -</option>
            <option value="10개입_1">10개입_1</option>
            <option value="10개입_2">10개입_2</option>
            <option value="30개입_1">30개입_1</option>
            <option value="30개입_2">30개입_2</option>
            <option value="50개입_1">50개입_1</option>
            <option value="50개입_2">50개입_2</option>
            <option value="100개입_1">100개입_1</option>
          </select>
          <p class="value"></p>
        </td>
      </tr>
      <tr class="xans-element- xans-product xans-product-quantity">
        <th scope="row">수량</th>
        <td><input type="text" name="quantity" value="1"></td>
      </tr>
    </tbody>
    <tbody>
      <tr class="xans-element- xans-product xans-product-addoption">
        <th scope="row">맛 구성</th>
        <td><textarea name="add_option"></textarea></td>
      </tr>
    </tbody>
  </table>

  <!-- {$total.total_id} → totalProducts -->
  <div id="totalProducts" class="">
    <table border="1">
      <caption>상품 목록</caption>
      <thead>
        <tr><th scope="col">상품명</th><th scope="col">상품수</th><th scope="col">가격</th></tr>
      </thead>
      <!-- 옵션 없는 단일상품용 tbody (옵션 상품에서는 비표시) -->
      <tbody class="displaynone">
        <tr><td>[골라담기] 한끼통살 통 닭가슴살 18종</td><td><span class="quantity">1</span></td><td class="right">24,700원</td></tr>
      </tbody>
      <!-- ★ 옵션 선택 시 행이 추가되는 tbody (마지막) -->
      <tbody></tbody>
    </table>
  </div>

  <div id="totalPrice" class="totalPrice">
    <strong>총 상품금액</strong>(수량) : <span class="total"><strong><em>0</em></strong> (0개)</span>
  </div>

  <div class="xans-element- xans-product xans-product-action">
    <div class="ec-base-button gColumn">
      <a href="#none" class="btnSubmit sizeL" onclick="product_submit('order');">
        <span>바로 구매하기</span>
      </a>
      <a href="#none" class="btnNormal sizeL" onclick="product_submit('basket');">장바구니 담기</a>
      <a href="#none" onclick="product_wishlist();" class="btnNormal sizeL">관심상품등록</a>
    </div>
  </div>
</div>

<script>
/* ---- 카페24 옵션 엔진 (기본 스킨 렌더링 결과 기준 모킹) ---- */
window.__cafe24Mock = (function () {
  var PRICES = { '10개입': 24700, '30개입': 70500, '50개입': 111500, '100개입': 196000 };
  var PRODUCT = '[골라담기] 한끼통살 통 닭가슴살 18종';
  var buttons = document.querySelectorAll('.ec-option-button');
  var sel = document.getElementById('product_option_id1');
  var tbodies = document.querySelectorAll('#totalProducts tbody');
  var tbody = tbodies[tbodies.length - 1];      /* 행은 마지막 tbody 에 추가 */
  var alerts = [];
  var submits = [];

  window.product_submit = function (kind) { submits.push(kind); };
  window.product_wishlist = function () { submits.push('wishlist'); };
  /* jsdom(runScripts:'outside-only') 은 인라인 onclick 을 실행하지 않으므로
   * 속성은 그대로 두고(가드의 제외 판별에 쓰임) 리스너로도 바인딩합니다.
   * 실제 카페24처럼 "파싱 시점에 이미 등록된 핸들러" 순서를 재현합니다. */
  [].forEach.call(document.querySelectorAll('.xans-product-action a[onclick]'), function (a) {
    var code = a.getAttribute('onclick');
    a.addEventListener('click', function (e) {
      e.preventDefault();
      if (/wishlist/.test(code)) window.product_wishlist();
      else window.product_submit(/basket/.test(code) ? 'basket' : 'order');
    });
  });

  function recalc() {
    var total = 0, cnt = 0;
    [].forEach.call(tbody.querySelectorAll('tr'), function (tr) {
      var q = parseInt(tr.querySelector('.quantity_opt').value, 10) || 1;
      total += parseInt(tr.dataset.unitPrice, 10) * q;
      cnt += q;
    });
    document.querySelector('#totalPrice em').textContent = total.toLocaleString();
    document.querySelector('#totalPrice .total').lastChild.textContent = ' (' + cnt + '개)';
  }

  function addRow(value) {
    var base = value.replace(/_\d+$/, '');
    var unit = PRICES[base] || 0;
    var tr = document.createElement('tr');
    tr.dataset.unitPrice = unit;
    tr.innerHTML =
      '<td><p class="product">' + PRODUCT + '<br /><span>' + value + '</span></p></td>' +
      '<td><span class="quantity"><input type="text" class="quantity_opt" value="1" />' +
      '<a href="javascript:;" class="up"><img alt="수량증가" /></a>' +
      '<a href="javascript:;" class="down"><img alt="수량감소" /></a></span>' +
      '<a href="#none"><img alt="삭제" class="option_box_del" /></a></td>' +
      '<td class="right"><span>' + unit.toLocaleString() + '원</span></td>';
    tr.querySelector('.option_box_del').addEventListener('click', function () { tr.remove(); recalc(); });
    tr.querySelector('.quantity_opt').addEventListener('input', recalc);
    tbody.appendChild(tr);
    recalc();
  }

  function alreadyPicked(value) {
    return [].some.call(tbody.querySelectorAll('tr .product span'), function (s) {
      return s.textContent.trim() === value;
    });
  }

  function select(value) {
    [].forEach.call(buttons, function (b) {
      b.classList.toggle('selected', b.getAttribute('rel') === value);
    });
    sel.value = value;
    if (alreadyPicked(value)) { alerts.push('이미 선택하신 옵션입니다.'); return; }
    addRow(value);
    [].forEach.call(buttons, function (b) { b.classList.remove('selected'); });
    sel.value = '*';
  }

  [].forEach.call(buttons, function (b) {
    b.addEventListener('click', function (e) { e.preventDefault(); select(b.getAttribute('rel')); });
  });
  sel.addEventListener('change', function () {
    if (sel.value && sel.value !== '*') select(sel.value);
  });

  return { alerts: alerts, submits: submits };
})();
</script>
</body>
</html>
