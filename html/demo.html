<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>골라담기 UI — 로컬 데모 (카페24 모킹)</title>
<link rel="stylesheet" href="../css/pick_option.css">
<style>
  body { margin: 0; font-family: -apple-system, "Pretendard", "Malgun Gothic", sans-serif; background: #fff; color: #191919; }
  .demo-wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px 140px; }
  .demo-note { background:#f7f7f7; border-radius:8px; padding:12px 14px; font-size:12px; color:#666; margin-bottom:16px; line-height:1.6; }
  /* ---- 카페24 기본 옵션(모킹): 실제 몰에서는 숨김 처리 대상 ---- */
  .mock-default { border:1px dashed #ccc; border-radius:8px; padding:10px 12px; margin:16px 0; font-size:12px; color:#888; }
  /* ---- 선택상품 목록(모킹) ---- */
  #totalProducts { width:100%; border-collapse:collapse; margin-top:14px; font-size:13px; }
  #totalProducts td { border-top:1px solid #eee; padding:12px 8px; vertical-align:top; }
  #totalProducts .opt-name strong { display:block; font-size:14px; }
  #totalProducts .price { text-align:right; font-weight:800; white-space:nowrap; }
  #totalProducts .del { text-align:right; }
  #totalProducts .del button { border:0; background:none; font-size:16px; color:#999; cursor:pointer; }
  .buybar { position:fixed; left:0; right:0; bottom:0; display:flex; gap:8px; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:#fff; border-top:1px solid #eee; max-width:480px; margin:0 auto; }
  .buybar .cart { flex:0 0 52px; border:1px solid #ddd; border-radius:8px; background:#fff; font-size:18px; }
  .buybar .buy { flex:1; height:48px; border:0; border-radius:8px; background:#ff6b00; color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
<div class="demo-wrap">
  <div class="demo-note">
    <strong>로컬 데모</strong> — 카페24의 옵션 select 와 선택상품 목록(#totalProducts)을
    모킹해 동작을 미리 확인하는 파일입니다. 실제 몰에는 업로드하지 않습니다.<br>
    콘솔에서 <code>PickOption.getState()</code> / <code>PickOption.rescan()</code> 확인 가능.
  </div>

  <!-- 골라담기 UI 마운트 -->
  <div id="pickOptionRoot"></div>

  <!-- 카페24 기본 옵션 (모킹) : 실제 몰에서는 CSS 로 숨김 -->
  <div class="mock-default">
    [모킹] 카페24 기본 옵션 select — 실제 몰에서는 숨김 처리
    <select option_select_element>
      <option value="*">- [필수] 옵션을 선택해 주세요 -</option>
      <option value="10개입_1">10개입_1</option>
      <option value="10개입_2">10개입_2</option>
      <option value="30개입_1">30개입_1</option>
      <option value="30개입_2">30개입_2</option>
      <option value="50개입_1">50개입_1</option>
      <option value="50개입_2">50개입_2</option>
      <option value="100개입_1">100개입_1</option>
    </select>
  </div>

  <!-- 선택상품 목록 (모킹) -->
  <table id="totalProducts"><tbody class="option_products"></tbody></table>
</div>

<div class="buybar">
  <button class="cart btn_cart" aria-label="장바구니">🛒</button>
  <button class="buy btnBuy">바로 구매하기</button>
</div>

<script>
/* ---- 카페24 옵션 change → 선택상품 행 생성 로직 (모킹) ---- */
(function () {
  var PRICES = { '10개입': 24700, '30개입': 70500, '50개입': 111500, '100개입': 196000 };
  var sel = document.querySelector('select[option_select_element]');
  var tbody = document.querySelector('#totalProducts .option_products');
  sel.addEventListener('change', function () {
    var v = sel.value;
    if (!v || v === '*') return;
    var base = v.replace(/_\d+$/, '');
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="opt-name option"><strong>' + v + '</strong></td>' +
      '<td class="price">' + (PRICES[base] || 0).toLocaleString() + '원</td>' +
      '<td class="del"><button type="button" aria-label="삭제">✕</button></td>';
    tr.querySelector('.del button').addEventListener('click', function () { tr.remove(); });
    tbody.appendChild(tr);
    sel.value = '*';
  });
})();
</script>
<script src="../js/option_config.js"></script>
<script src="../js/pick_option.js"></script>
</body>
</html>
